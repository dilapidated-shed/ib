name: Android WebView protected transaction

on:
  workflow_dispatch:
  push:
    paths:
      - "android-webview/**"
      - ".github/workflows/android-webview.yml"
  pull_request:
    paths:
      - "android-webview/**"
      - ".github/workflows/android-webview.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      IB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      IB_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      IB_TEST_KEYSTORE_PASSWORD: wegert-debug
      IB_TEST_KEY_PASSWORD: wegert-debug
      IB_TEST_KEY_ALIAS: wegert-debug
      IB_EXPECTED_CERT_SHA256: DE:9B:1D:47:C5:A6:5E:6D:46:A2:04:B7:9D:D9:EE:56:6B:9D:3C:98:32:BA:81:EB:C4:21:3D:33:92:E9:2F:F9
    defaults:
      run:
        working-directory: android-webview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.13"

      - name: Verify stable test signing identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$IB_TEST_KEYSTORE" \
            -storepass "$IB_TEST_KEYSTORE_PASSWORD" \
            -alias "$IB_TEST_KEY_ALIAS" \
            | grep -F "SHA256: $IB_EXPECTED_CERT_SHA256"

      - name: Test, lint, and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:verifyWebViewBoundary

      - name: Verify APK signer
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$sdk_root/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | tee /tmp/ib-webview-signing.txt
          expected="$(printf '%s' "$IB_EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          grep -Fq "Signer #1 certificate SHA-256 digest: $expected" /tmp/ib-webview-signing.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-webview-protected-transaction-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk

  replacement-install:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ib-webview-protected-transaction-apk
          path: downloaded-apk

      - name: Install and replace twice without uninstall
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk

  low-memory-real-page-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ib-webview-protected-transaction-apk
          path: downloaded-apk

      - name: Load DuckDuckGo in a deliberately small Android 14 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 1
          ram-size: 1024M
          heap-size: 192M
          disable-animations: true
          script: |
            set -eu

            package=org.isomorphisms.ib.webview
            activity="$package/.LongViewActivity"
            url='https://duckduckgo.com/?q=ib+browser+smoke'

            mkdir -p low-memory-page-smoke
            adb install -r downloaded-apk/app-debug.apk
            adb shell wm size 480x800
            adb shell wm density 240
            adb shell am force-stop "$package"

            adb shell am start -W -n "$activity" --es url "$url"               | tee low-memory-page-smoke/am-start.txt

            passed=false
            for second in $(seq 1 45); do
              if adb shell run-as "$package" sh -c 'cat files/receipts/*/*.tsv'                    > low-memory-page-smoke/receipt.tsv 2>/dev/null; then
                if grep -Fq 'stage=commit-visible' low-memory-page-smoke/receipt.tsv                    && grep -Fq 'stage=page-finished' low-memory-page-smoke/receipt.tsv                    && grep -F 'navigation-timing' low-memory-page-smoke/receipt.tsv                         | grep -Fq 'available=true'; then
                  passed=true
                  break
                fi
              fi
              sleep 1
            done

            adb exec-out screencap -p > low-memory-page-smoke/duckduckgo.png || true
            adb shell dumpsys meminfo "$package" > low-memory-page-smoke/meminfo.txt || true
            adb shell dumpsys webviewupdate > low-memory-page-smoke/webview.txt || true

            cat low-memory-page-smoke/receipt.tsv || true

            test "$passed" = true
            ! grep -Fq \terror\t' low-memory-page-smoke/receipt.tsv
            grep -Fq 'stage=page-started' low-memory-page-smoke/receipt.tsv
            grep -Fq 'stage=commit-visible' low-memory-page-smoke/receipt.tsv
            grep -Fq 'stage=page-finished' low-memory-page-smoke/receipt.tsv
            grep -F 'navigation-timing' low-memory-page-smoke/receipt.tsv               | grep -Fq 'available=true'

      - name: Upload low-memory page-load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-low-memory-real-page-smoke
          path: low-memory-page-smoke/
